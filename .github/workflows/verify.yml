name: Verify WaterWise
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use project npm version
        run: npm install --global npm@10.9.9 --no-audit --no-fund
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Firestore security rules tests
        run: npm run test:rules
      - name: Next.js production build
        run: npm run build
